name: Validate php-apache 5.6 security backport

on:
  pull_request:
    paths:
      - php-apache/5.6/**
      - .github/workflows/php-apache-56-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build patched image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./php-apache/5.6
          target: php-apache
          platforms: linux/amd64
          load: true
          tags: devitools/php-apache:5.6
          cache-from: type=gha,scope=php-apache-56-security
          cache-to: type=gha,mode=max,scope=php-apache-56-security
      - name: Verify compatibility and security behavior
        run: python3 php-apache/5.6/.scripts/smoke.py devitools/php-apache:5.6
