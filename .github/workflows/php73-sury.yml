name: Validate PHP 7.3 Sury backport

on:
  pull_request:
    paths:
      - php-apache/7.3-sury/**
      - .github/workflows/php73-sury.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build patched image
        run: docker build --platform linux/amd64 -t devitools/php-apache:7.3-sury php-apache/7.3-sury
      - name: Verify compatibility and security behavior
        run: python3 php-apache/7.3-sury/.scripts/smoke.py devitools/php-apache:7.3-sury
